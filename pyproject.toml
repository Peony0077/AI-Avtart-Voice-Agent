[project]
name = "ai-avatar-voice-agent"
version = "0.1.0"
description = "Self-hosted real-time conversational avatar (voice, RAG, neural talking face)"
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
markers = [
    "gpu: needs CUDA and downloaded models",
    "slow: takes more than a few seconds",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["avatar/*/vendor", "backend/app/tts/openvoice", "frontend", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# closures that are called/awaited within the same loop iteration (no late-binding bug)
"scripts/bench_voice.py" = ["B023"]
"voice/xtts/worker.py" = ["B023"]
"avatar/musetalk/profile_vae.py" = ["B023"]
"avatar/musetalk/profile_engine.py" = ["B023"]
# import order matters: `common` puts vendor/LivePortrait on sys.path before the `src.*` imports
"avatar/musetalk/face_rig.py" = ["I001"]

[tool.ruff.lint.isort]
# workers run from their own folder (separate venvs): their sibling modules are first-party
known-first-party = ["app", "catchup", "common", "engine", "gestures", "motion", "face_rig", "face_bbox", "worker", "lipsync", "body_motion", "video_source", "speech_body", "h264", "upscale"]
